name: Build

on:
  - push
  - workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows
            ext: ".exe"
          - os: ubuntu-latest
            artifact: Linux
            ext: ""
          - os: macos-latest
            artifact: macOS
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        shell: bash
        working-directory: src
        run: go build -o ../fireball${{ matrix.ext }} ./cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: fireball${{ matrix.ext }}

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows
            ext: ".exe"
          - os: ubuntu-latest
            artifact: Linux
            ext: ""
          - os: macos-latest
            artifact: macOS
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}

      - name: Restore executable bit
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x fireball

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          version: "22.1.8"

      - name: Run tests (debug)
        shell: bash
        working-directory: tests
        run: ../fireball${{ matrix.ext }} test

      - name: Run tests (release)
        shell: bash
        working-directory: tests
        run: ../fireball${{ matrix.ext }} test -p release

  package-vscode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install VSCE
        shell: bash
        run: npm install -g @vscode/vsce

      - name: Build VSCode extension
        shell: bash
        working-directory: vscode-extension
        run: |
          npm install
          vsce package

      - name: Upload VSCode extension
        uses: actions/upload-artifact@v7
        with:
          name: VSCode
          path: vscode-extension/*.vsix
