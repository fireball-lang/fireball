name: Build

on:
  - push
  - workflow_dispatch

env:
  LLVM_VERSION: "22.1.8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: windows-latest
            os: "windows"
            arch: "amd64"
            ext: ".exe"
          - runs_on: ubuntu-latest
            os: "linux"
            arch: "amd64"
            ext: ""
          - runs_on: macos-latest
            os: "macos"
            arch: "aarch64"
            ext: ""

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        shell: bash
        working-directory: src
        run: go build -o ../fireball${{ matrix.ext }} ./cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.os }}-${{ matrix.arch }}"
          path: fireball${{ matrix.ext }}

  test:
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: windows-latest
            os: "windows"
            arch: "amd64"
            ext: ".exe"
          - runs_on: ubuntu-latest
            os: "linux"
            arch: "amd64"
            ext: ""
          - runs_on: macos-latest
            os: "macos"
            arch: "aarch64"
            ext: ""

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: "${{ matrix.os }}-${{ matrix.arch }}"

      - name: Restore executable bit
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x fireball

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          path: "llvm"

      - name: Run tests (debug)
        shell: bash
        working-directory: tests
        run: ../fireball${{ matrix.ext }} test

      - name: Run tests (release)
        shell: bash
        working-directory: tests
        run: ../fireball${{ matrix.ext }} test -p release

  package:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Windows (amd64)
      - name: Download Fireball (windows, amd64)
        uses: actions/download-artifact@v8
        with:
          name: "windows-amd64"
          path: "fireball-windows-amd64/bin"
      - name: Download LLVM (windows, amd64)
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
          os: "windows"
          arch: "amd64"
          path: "fireball-windows-amd64/tools"
      - name: Package (windows, amd64)
        shell: bash
        env:
          FIREBALL: "fireball-windows-amd64"
        run: 7z a "$FIREBALL.zip" "$FIREBALL"

      # Linux (amd64)
      - name: Download Fireball (linux, amd64)
        uses: actions/download-artifact@v8
        with:
          name: "linux-amd64"
          path: "fireball-linux-amd64/bin"
      - name: Download LLVM (linux, amd64)
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
          os: "linux"
          arch: "amd64"
          path: "fireball-linux-amd64/tools"
      - name: Package (linux, amd64)
        shell: bash
        env:
          FIREBALL: "fireball-linux-amd64"
        run: |
          chmod +x "$FIREBALL/bin/fireball"
          tar -czvf "$FIREBALL.tar.gz" "$FIREBALL"

      # MacOS (aarch64)
      - name: Download Fireball (macos, aarch64)
        uses: actions/download-artifact@v8
        with:
          name: "macos-aarch64"
          path: "fireball-macos-aarch64/bin"
      - name: Download LLVM (macos, aarch64)
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
          os: "macos"
          arch: "aarch64"
          path: "fireball-macos-aarch64/tools"
      - name: Package (macos, aarch64)
        shell: bash
        env:
          FIREBALL: "fireball-macos-aarch64"
        run: |
          chmod +x "$FIREBALL/bin/fireball"
          tar -czvf "$FIREBALL.tar.gz" "$FIREBALL"

      # Update Release
      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "development"
          name: "Fireball"
          prerelease: true
          body: |
            Latest bleeding-edge build from commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            **Commit message:** ${{ github.event.head_commit.message || 'Manual workflow run' }}
          files: |
            fireball-windows-amd64.zip
            fireball-linux-amd64.tar.gz
            fireball-macos-aarch64.tar.gz

  package-vscode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install VSCE
        shell: bash
        run: npm install -g @vscode/vsce

      - name: Build VSCode extension
        shell: bash
        working-directory: vscode-extension
        run: |
          npm install
          vsce package

      - name: Upload VSCode extension
        uses: actions/upload-artifact@v7
        with:
          name: VSCode
          path: vscode-extension/*.vsix
